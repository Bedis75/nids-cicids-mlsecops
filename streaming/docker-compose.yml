services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  producer:
    image: nids-producer
    container_name: nids-producer
    depends_on:
      - kafka
    volumes:
      - ../data/processed:/app/data:ro
    environment:
      KAFKA_SERVER: kafka:9092
      PARQUET_PATH: /app/data/cicids_clean.parquet

  consumer:
    image: nids-consumer
    container_name: nids-consumer
    depends_on:
      - kafka
    volumes:
      - ./runtime:/app/data
    environment:
      KAFKA_SERVER: kafka:9092
      DB_PATH: /app/data/predictions.db

  dashboard:
    image: nids-dashboard
    container_name: nids-dashboard
    depends_on:
      - consumer
    ports:
      - "8501:8501"
    volumes:
      - ./runtime:/app/data
    environment:
      DB_PATH: /app/data/predictions.db
