apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: nids-consumer
          imagePullPolicy: Never
          env:
            - name: KAFKA_SERVER
              value: "kafka:9092"
            - name: DB_PATH
              value: "/app/predictions.db"
