apiVersion: v1
kind: Pod
metadata:
  name: copy-pod
spec:
  containers:
    - name: helper
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: parquet-pvc
