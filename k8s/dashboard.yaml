apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: nids-dashboard
          imagePullPolicy: Never
          env:
            - name: DB_PATH
              value: "/app/data/predictions.db"
          volumeMounts:
            - name: predictions
              mountPath: /app/data
      volumes:
        - name: predictions
          persistentVolumeClaim:
            claimName: predictions-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30085
